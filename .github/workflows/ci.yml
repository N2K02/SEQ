name: SEQ validation
on:
  push:
    branches: [main, experimental/high-fidelity-engine]
  pull_request:
jobs:
  dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native DSP and run tests
        run: |
          cmake -S dsp -B dsp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build dsp/build -j 2
          ctest --test-dir dsp/build --output-on-failure
  android:
    runs-on: ubuntu-latest
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
      N2K02_PACKAGES_USER: N2K02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - name: Verify private dependency credential
        run: test -n "$N2K02_PACKAGES_TOKEN" || { echo "::error::N2K02_PACKAGES_TOKEN secret is missing. Configure private GitHub Packages read token in SEQ repository Actions secrets."; exit 1; }
      - name: Compile and run JVM unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SEQ-experimental-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
